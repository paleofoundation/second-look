name: Claude scheduled fill
on:
  schedule:
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
concurrency:
  group: claude-fill
  cancel-in-progress: false
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        env:
          DEPOSITS_READ_TOKEN: ${{ secrets.DEPOSITS_READ_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read the file .claude/scheduled-fill-prompt.md in this repository and follow it exactly.
          show_full_output: true
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,LS,TodoWrite,WebFetch,WebSearch,Bash(git:*),Bash(gh:*),Bash(node:*),Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(python3:*),Bash(pdftotext:*),Bash(curl:*),Bash(jq:*),Bash(ls:*),Bash(cat:*),Bash(mkdir:*),Bash(cp:*),Bash(date:*)"
            --disallowedTools "Bash(gh secret:*),Bash(gh pr merge:*)"
